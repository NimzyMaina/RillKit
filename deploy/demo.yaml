# A self-contained RillKit demo, pulling published images: no clone, no build.
#
#   curl -fsSLO https://raw.githubusercontent.com/NimzyMaina/RillKit/main/deploy/demo.yaml
#   docker compose -f demo.yaml up -d
#   open http://localhost:8080   token: rillkit-local-admin-token
#
# Local demos only: the admin token and API key are fixed and public, and the workers talk to
# the server over plain ws:// on the Compose network. Do not expose this.
#
# Pin a release with RILLKIT_VERSION=v0.4.0 in the environment or a .env file. The default,
# edge, follows main.

name: rillkit-demo

x-demo: &demo
  image: ${RILLKIT_DEMO_IMAGE:-ghcr.io/nimzymaina/rillkit-demo}:${RILLKIT_VERSION:-edge}
  environment: &demo-env
    RILLKIT_URL: redis://valkey:6379/0
    RILLKIT_BACKEND: redis
    RILLKIT_CONTROL: relay
    RILLKIT_CONTROL_URL: http://server:8080
    RILLKIT_CONTROL_INSECURE: "1"
    RILLKIT_API_KEY: rk_demo_local_only_not_a_secret_0000000000
    RILLKIT_CAPTURE_LOGS: "true"
    RILLKIT_TRACE_RECORDS: "true"
    RILLKIT_INSPECT_MESSAGES: "true"
  depends_on:
    server:
      condition: service_healthy
    valkey:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rillkit
      POSTGRES_PASSWORD: rillkit
      POSTGRES_DB: rillkit
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rillkit -d rillkit"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  server:
    image: ${RILLKIT_IMAGE:-ghcr.io/nimzymaina/rillkit-server}:${RILLKIT_VERSION:-edge}
    ports: ["${RILLKIT_DEMO_PORT:-8080}:8080"]
    environment:
      RILLKIT_SERVER_DATABASE_URL: postgresql://rillkit:rillkit@postgres:5432/rillkit
      RILLKIT_SERVER_ADMIN_TOKEN: rillkit-local-admin-token
      RILLKIT_SERVER_PUBLIC_URL: http://localhost:${RILLKIT_DEMO_PORT:-8080}
      RILLKIT_SERVER_BOOTSTRAP_TENANT: demo
      RILLKIT_SERVER_BOOTSTRAP_API_KEY: rk_demo_local_only_not_a_secret_0000000000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *demo
    deploy:
      replicas: 2

  producer:
    <<: *demo
    environment:
      <<: *demo-env
      DEMO_ROLE: producer

  # orders.raw -> orders.enriched, one trace every two minutes (the second stream retries once)
  flow:
    <<: *demo
    environment:
      <<: *demo-env
      DEMO_ROLE: flow
      DEMO_FLOW_INTERVAL_SEC: "120"

volumes:
  postgres:
