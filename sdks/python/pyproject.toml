[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rillkit"
version = "0.4.1"
description = "Simple publish and consume for Redis Streams: consumer groups, retries, DLQ, ack policies and middleware."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nimrod Maina" }]
keywords = ["redis", "streams", "consumer-group", "queue", "messaging", "worker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["redis>=5.0", "tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
valkey = ["valkey>=6.1.1,<6.3"]
yaml = ["pyyaml>=6.0"]
control = [
    "websockets>=13",
]

[project.urls]
Homepage = "https://nimzymaina.github.io/RillKit/"
Documentation = "https://nimzymaina.github.io/RillKit/"
Repository = "https://github.com/NimzyMaina/RillKit"
Issues = "https://github.com/NimzyMaina/RillKit/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "pydantic>=2",
    "ruff>=0.6",
    "mypy>=1.10",
    "build",
    "twine",
    "valkey>=6.1.1,<6.3",
    "jsonschema>=4.18",
    "websockets>=13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rillkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
# the shared spec lives at the repository root; ship it so the sdist's conformance tests run
"../../spec" = "spec"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "standalone_only: needs a standalone server (skipped when RILLKIT_TEST_MODE=cluster)",
    "cluster_only: needs a cluster (RILLKIT_TEST_MODE=cluster)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP007", "UP045"]
