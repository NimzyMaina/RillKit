name: Docs

# Builds the versioned docs site: latest from main at the root, plus a frozen
# snapshot at /<tag>/ for every stable vX.Y.Z tag (scripts/build-docs.mjs).
# This workflow never pushes, so it cannot trigger itself.
on:
  push:
    branches: [main]
    # path filters only apply to branch pushes; tag pushes always run
    paths:
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-docs.mjs"
      - ".github/workflows/docs.yml"
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # always build latest from main, even when a tag push triggered the run;
      # full history so every release tag is available
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Snapshots are immutable; the script keys each one by tag, commit and
      # builder version, and prunes entries it no longer uses.
      - uses: actions/cache@v4
        with:
          path: .docs-build/cache
          key: docs-snapshots-${{ hashFiles('scripts/build-docs.mjs') }}-${{ github.run_id }}
          restore-keys: |
            docs-snapshots-${{ hashFiles('scripts/build-docs.mjs') }}-
            docs-snapshots-
      - name: List GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --json tagName --jq '[.[].tagName] | join(",")')
          echo "RILLKIT_GH_RELEASES=$releases" >> "$GITHUB_ENV"
      - run: npm run docs:build:versions
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .docs-build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
