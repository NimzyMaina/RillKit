name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.9"
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run mypy src

  standalone:
    # The same behavioural suite against a standalone Redis and a standalone Valkey, on every
    # supported Python. uv.lock picks the client versions that support each Python (valkey-py 6.2
    # needs 3.11, so 3.9 and 3.10 test valkey-py 6.1).
    name: py${{ matrix.python-version }} ${{ matrix.backend }} standalone
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        backend: [redis, valkey]
        include:
          - backend: redis
            image: redis:7
          - backend: valkey
            image: valkey/valkey:8
    services:
      server:
        image: ${{ matrix.image }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "${{ matrix.backend }}-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
      RILLKIT_TEST_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run pytest -q

  cluster:
    # Six-node clusters (three primaries) started by scripts/test-cluster.sh, because a service
    # container cannot run the cluster setup commands.
    name: py3.12 ${{ matrix.backend }} cluster
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [redis, valkey]
    env:
      RILLKIT_TEST_BACKEND: ${{ matrix.backend }}
      RILLKIT_TEST_MODE: cluster
      RILLKIT_TEST_CLUSTER_NODES: 127.0.0.1:7101
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: scripts/test-cluster.sh ${{ matrix.backend }} 7101
      - run: uv sync --group dev
      - run: uv run pytest -q
      - if: always()
        run: scripts/test-cluster.sh stop ${{ matrix.backend }}

  newest-clients:
    # Client libraries change defaults between major versions (redis-py 8 set socket_timeout to
    # 5 s), and users install the newest release, so test against it as well as the locked one.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6380:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv pip install --upgrade redis valkey
      - run: uv run --no-sync python -c "import redis, valkey; print(redis.__version__, valkey.__version__)"
      - run: uv run --no-sync pytest -q
        env:
          REDIS_URL: redis://localhost:6379/15
      - run: uv run --no-sync pytest -q
        env:
          REDIS_URL: redis://localhost:6380/15
          RILLKIT_TEST_BACKEND: valkey

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
      - name: The valkey extra installs and Redis stays the only hard dependency
        run: |
          uv venv /tmp/plain && uv pip install --python /tmp/plain dist/*.whl
          /tmp/plain/bin/python -c "import rillkit, redis; import importlib.util as u; assert u.find_spec('valkey') is None"
          uv venv /tmp/extra && uv pip install --python /tmp/extra "$(ls dist/*.whl)[valkey]"
          /tmp/extra/bin/python -c "import rillkit, valkey; rillkit.Settings(backend='valkey').client().close()"
