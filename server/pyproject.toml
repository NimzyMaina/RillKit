[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rillkit-server"
version = "0.4.0"
description = "RillKit control plane: Relay gateway, directive router, autoscaler and dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
authors = [{ name = "Nimrod Maina" }]
dependencies = [
    "rillkit[control]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
rillkit-server = "rillkit_server.__main__:main"

[tool.uv.sources]
rillkit = { path = "../sdks/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "jsonschema>=4.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rillkit_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
